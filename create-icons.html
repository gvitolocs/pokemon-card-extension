<!DOCTYPE html>
<html>
<head>
    <title>Generatore Icone</title>
</head>
<body>
    <canvas id="canvas" width="128" height="128" style="border:1px solid black;"></canvas>
    <br>
    <button onclick="createIcon('default')">Crea Icona Default</button>
    <button onclick="createIcon('green')">Crea Icona Verde</button>
    <button onclick="createIcon('red')">Crea Icona Rossa</button>
    
    <script>
        function createIcon(type) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            // Pulisci canvas
            ctx.clearRect(0, 0, 128, 128);
            
            // Colori base
            let bgColor, cardColor, textColor;
            switch(type) {
                case 'green':
                    bgColor = '#4CAF50';
                    cardColor = '#2E7D32';
                    textColor = '#FFFFFF';
                    break;
                case 'red':
                    bgColor = '#F44336';
                    cardColor = '#C62828';
                    textColor = '#FFFFFF';
                    break;
                default:
                    bgColor = '#2196F3';
                    cardColor = '#1976D2';
                    textColor = '#FFFFFF';
                    break;
            }
            
            // Sfondo
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, 128, 128);
            
            // Carta Pokemon (rettangolo arrotondato)
            ctx.fillStyle = cardColor;
            ctx.fillRect(20, 30, 88, 68);
            
            // Testo "P"
            ctx.fillStyle = textColor;
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('P', 64, 75);
            
            // Scarica l'immagine
            const link = document.createElement('a');
            link.download = `icon-${type}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
