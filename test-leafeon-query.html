<!DOCTYPE html>

    <script>
        // Configurazione Supabase
        const supabaseUrl = 'https://msngrrrihwudtnyjatlo.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zbmdycnJpaHd1ZHRueWphdGxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTAzNTU2NTIsImV4cCI6MjA2NTkzMTY1Mn0.Y0D-FHepxqXznrg2W0n_NOJkgY--GOPJD4EoloK94Yo';
        
        let supabase;
        
        // Inizializza Supabase quando la libreria è caricata
        function initSupabase() {
            if (window.supabase) {
                supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Avvia inizializzazione

        function addResult(title, content, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'query-section';
            
            const titleDiv = document.createElement('div');
            titleDiv.className = 'query-title';
            titleDiv.textContent = title;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = `result ${type}`;
            contentDiv.innerHTML = content;
            
            div.appendChild(titleDiv);
            div.appendChild(contentDiv);
            resultsDiv.appendChild(div);
        }
        
        async function queryLeafeonTerastal() {
            addResult('📊 Query 1: Leafeon con espansione Terastal', '<div class="loading">Caricamento...</div>');
            
            if (!supabase) {
                addResult('❌ Errore Query 1', 'Supabase non inizializzato', 'error');
                return;
            }
            
            try {
                const { data, error } = await supabase
                    .from('cards')
                    .select('*')
                    .ilike('name_en', '%leafeon%')
                    .ilike('expansion_name_en', '%terastal%')
                    .limit(10);
                
                if (error) {
                    addResult('❌ Errore Query 1', error.message, 'error');
                } else {
                    let content = `<strong>Trovati ${data.length} risultati:</strong><br>`;
                    if (data.length === 0) {
                        content += 'Nessun risultato trovato';
                    } else {
                        data.forEach(card => {
                            content += `• ${card.name_en} [${card.expansion_code}] #${card.collector_number} (ID: ${card.blueprint_id})<br>`;
                        });
                    }
                    addResult('✅ Query 1 Completata', content, 'success');
                }
            } catch (error) {
                addResult('❌ Errore Query 1', error.message, 'error');
            }
        }

        async function queryLeafeonVariants() {
            addResult('📊 Query 5: Leafeon in card_variants (con JOIN)', '<div class="loading">Caricamento...</div>');
            
            if (!supabase) {
                addResult('❌ Errore Query 5', 'Supabase non inizializzato', 'error');
                return;
            }
            
            try {
                // First get Leafeon cards from cards table
                const { data: cards, error: cardsError } = await supabase
                    .from('cards')
                    .select('blueprint_id, name_en, expansion_code')
                    .ilike('name_en', '%leafeon%')
                    .limit(10);
                
                if (cardsError) {
                    addResult('❌ Errore Query 5', cardsError.message, 'error');
                    return;
                }
                
                if (!cards || cards.length === 0) {
                    addResult('✅ Query 5 Completata', '<strong>Nessuna carta Leafeon trovata nella tabella cards</strong>', 'success');
                    return;
                }
                
                // Get blueprint_ids
                const blueprintIds = cards.map(card => card.blueprint_id).filter(id => id);
                
                if (blueprintIds.length === 0) {
                    addResult('✅ Query 5 Completata', '<strong>Nessun blueprint_id valido trovato</strong>', 'success');
                    return;
                }
                
                // Now search for variants
                const { data: variants, error: variantsError } = await supabase
                    .from('card_variants')
                    .select('*')
                    .in('blueprint_id', blueprintIds)
                    .limit(20);
                
                if (variantsError) {
                    addResult('❌ Errore Query 5', variantsError.message, 'error');
                } else {
                    let content = `<strong>Trovati ${variants.length} risultati:</strong><br>`;
                    content += `<strong>Base cards (${cards.length}):</strong><br>`;
                    cards.forEach(card => {
                        content += `• ${card.name_en} [${card.expansion_code}] (ID: ${card.blueprint_id})<br>`;
                    });
                    
                    if (variants.length > 0) {
                        content += `<br><strong>Variants (${variants.length}):</strong><br>`;
                        variants.forEach(variant => {
                            const card = cards.find(c => c.blueprint_id === variant.blueprint_id);
                            const collectorNum = variant.collector_number ? `#${variant.collector_number}` : '';
                            content += `• Variant ID: ${variant.id} (Blueprint: ${variant.blueprint_id}) - ${card?.name_en || 'Unknown'} [${card?.expansion_code || 'Unknown'}] ${collectorNum}<br>`;
                        });
                    } else {
                        content += '<br>Nessuna variante trovata';
                    }
                    
                    addResult('✅ Query 5 Completata', content, 'success');
                }
            } catch (error) {
                addResult('❌ Errore Query 5', error.message, 'error');
            }
        }
        
        async function queryLeafeonExtensionLogic() {
            addResult('📊 Query 6: Logica Extension (searchCardVariants)', '<div class="loading">Caricamento...</div>');
            
            if (!supabase) {
                addResult('❌ Errore Query 6', 'Supabase non inizializzato', 'error');
                return;
            }
            
            try {
                const pokemonNameLower = 'leafeon';
                let results = [];
                
                // First, search in the cards table to get blueprint_ids
                const { data: cards, error: cardsError } = await supabase
                    .from('cards')
                    .select('blueprint_id, name_en, expansion_name_en, expansion_code')
                    .ilike('name_en', `%${pokemonNameLower}%`)
                    .limit(50);
                
                if (cardsError) {
                    addResult('❌ Errore Query 6', cardsError.message, 'error');
                    return;
                }
                
                if (cards && cards.length > 0) {
                    // Get blueprint_ids from found cards
                    const blueprintIds = cards.map(card => card.blueprint_id).filter(id => id);
                    
                    if (blueprintIds.length > 0) {
                        // Search for variants of these cards
                        const { data: variants, error: variantsError } = await supabase
                            .from('card_variants')
                            .select('*')
                            .in('blueprint_id', blueprintIds)
                            .limit(100);
                        
                        if (!variantsError && variants && variants.length > 0) {
                            // Combine card data with variant data (like in extension)
                            const combinedResults = variants.map(variant => {
                                const card = cards.find(c => c.blueprint_id === variant.blueprint_id);
                                return {
                                    ...variant,
                                    name_en: card?.name_en,
                                    card_name: card?.name_en,
                                    pokemon_name: card?.name_en,
                                    expansion_name_en: card?.expansion_name_en,
                                    expansion_name: card?.expansion_name_en,
                                    expansion_code: card?.expansion_code,
                                    collector_number: variant.collector_number, // Get from variant, not card
                                    source_table: 'card_variants'
                                };
                            });
                            
                            results.push(...combinedResults);
                        }
                    }
                    
                    // Also add the base cards themselves
                    const baseCards = cards.map(card => ({
                        ...card,
                        name_en: card.name_en,
                        pokemon_name: card.name_en,
                        expansion_name_en: card.expansion_name_en,
                        expansion_name: card.expansion_name_en,
                        source_table: 'cards'
                    }));
                    
                    results.push(...baseCards);
                }
                
                let content = `<strong>Trovati ${results.length} risultati totali:</strong><br>`;
                if (results.length === 0) {
                    content += 'Nessun risultato trovato';
                } else {
                    results.forEach(card => {
                        const source = card.source_table || 'unknown';
                        const collectorNum = card.collector_number ? `#${card.collector_number}` : '';
                        content += `• ${card.name_en} [${card.expansion_code}] ${collectorNum} (ID: ${card.blueprint_id}) [${source}]<br>`;
                    });
                }
                
                addResult('✅ Query 6 Completata', content, 'success');
            } catch (error) {
                addResult('❌ Errore Query 6', error.message, 'error');
            }
        }

        async function discoverTableStructure() {
            addResult('📊 Query 8: Scopri Struttura Tabella Cards', '<div class="loading">Caricamento...</div>');
            
            if (!supabase) {
                addResult('❌ Errore Query 8', 'Supabase non inizializzato', 'error');
                return;
            }
            
            try {
                // Get one Leafeon card to examine its structure
                const { data, error } = await supabase
                    .from('cards')
                    .select('*')
                    .ilike('name_en', '%leafeon%')
                    .limit(1);
                
                if (error) {
                    addResult('❌ Errore Query 8', error.message, 'error');
                } else if (data && data.length > 0) {
                    const card = data[0];
                    let content = `<strong>Struttura della tabella cards (esempio con Leafeon):</strong><br>`;
                    content += `<pre>${JSON.stringify(card, null, 2)}</pre>`;
                    
                    // Look for collector number related fields
                    const collectorFields = Object.keys(card).filter(key => 
                        key.toLowerCase().includes('collector') || 
                        key.toLowerCase().includes('number') ||
                        key.toLowerCase().includes('num')
                    );
                    
                    if (collectorFields.length > 0) {
                        content += `<br><strong>Campi che potrebbero essere collector_number:</strong><br>`;
                        collectorFields.forEach(field => {
                            content += `• ${field}: ${card[field]}<br>`;
                        });
                    } else {
                        content += `<br><strong>Nessun campo collector_number trovato</strong><br>`;
                    }
                    
                    addResult('✅ Query 8 Completata', content, 'success');
                } else {
                    addResult('✅ Query 8 Completata', 'Nessuna carta Leafeon trovata per esaminare la struttura', 'success');
                }
            } catch (error) {
                addResult('❌ Errore Query 8', error.message, 'error');
            }
        }
        
        async function testExtensionFiltering() {
            addResult('📊 Query 9: Test Filtro Extension (sv8a + #200)', '<div class="loading">Caricamento...</div>');
            
            if (!supabase) {
                addResult('❌ Errore Query 9', 'Supabase non inizializzato', 'error');
                return;
            }
            
            try {
                // Simulate the extension's search logic
                const pokemonName = 'leafeon';
                const expansionCode = 'sv8a';
                const collectorNumber = '200';
                
                // Step 1: Find all Leafeon cards
                const { data: cards, error: cardsError } = await supabase
                    .from('cards')
                    .select('blueprint_id, name_en, expansion_code')
                    .ilike('name_en', `%${pokemonName}%`)
                    .limit(50);
                
                if (cardsError) {
                    addResult('❌ Errore Query 9', cardsError.message, 'error');
                    return;
                }
                
                if (!cards || cards.length === 0) {
                    addResult('✅ Query 9 Completata', 'Nessuna carta Leafeon trovata', 'success');
                    return;
                }
                
                // Step 2: Filter by expansion code
                const expansionFiltered = cards.filter(card => 
                    card.expansion_code === expansionCode
                );
                
                if (expansionFiltered.length === 0) {
                    addResult('✅ Query 9 Completata', `Nessuna carta Leafeon trovata in espansione ${expansionCode}`, 'success');
                    return;
                }
                
                // Step 3: Get variants for these cards
                const blueprintIds = expansionFiltered.map(card => card.blueprint_id).filter(id => id);
                
                const { data: variants, error: variantsError } = await supabase
                    .from('card_variants')
                    .select('*')
                    .in('blueprint_id', blueprintIds)
                    .limit(100);
                
                if (variantsError) {
                    addResult('❌ Errore Query 9', variantsError.message, 'error');
                    return;
                }
                
                // Step 4: Filter by collector number
                const numberFiltered = variants.filter(variant => 
                    variant.collector_number === collectorNumber
                );
                
                let content = `<strong>Risultati filtro extension:</strong><br>`;
                content += `<strong>Step 1 - Tutte le carte Leafeon:</strong> ${cards.length}<br>`;
                content += `<strong>Step 2 - Filtro espansione ${expansionCode}:</strong> ${expansionFiltered.length}<br>`;
                content += `<strong>Step 3 - Varianti trovate:</strong> ${variants.length}<br>`;
                content += `<strong>Step 4 - Filtro numero ${collectorNumber}:</strong> ${numberFiltered.length}<br><br>`;
                
                if (numberFiltered.length > 0) {
                    content += `<strong>🎯 RISULTATO FINALE - Leafeon Terastal #200 trovato!</strong><br>`;
                    numberFiltered.forEach(variant => {
                        const card = expansionFiltered.find(c => c.blueprint_id === variant.blueprint_id);
                        content += `• ${card?.name_en} [${card?.expansion_code}] #${variant.collector_number} (ID: ${variant.blueprint_id})<br>`;
                    });
                } else {
                    content += `<strong>❌ Leafeon Terastal #200 NON trovato</strong><br>`;
                    content += `<strong>Varianti disponibili per ${expansionCode}:</strong><br>`;
                    variants.forEach(variant => {
                        const card = expansionFiltered.find(c => c.blueprint_id === variant.blueprint_id);
                        content += `• ${card?.name_en} [${card?.expansion_code}] #${variant.collector_number} (ID: ${variant.blueprint_id})<br>`;
                    });
                }
                
                addResult('✅ Query 9 Completata', content, 'success');
            } catch (error) {
                addResult('❌ Errore Query 9', error.message, 'error');
            }
        }
        
        async function runAllQueries() {
            clearResults();
            addResult('🚀 Avvio Query', 'Esecuzione di tutte le query in parallelo...');
            
            // Aspetta che Supabase sia inizializzato
            while (!supabase) {
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            
            await Promise.all([
                queryLeafeonTerastal(),
                queryLeafeonSv8a(),
                queryLeafeonNumber200(),
                queryAllLeafeon(),
                queryLeafeonVariants(),
                queryLeafeonExtensionLogic(),
                queryLeafeonSv8aNumber200(),
                discoverTableStructure(),
                testExtensionFiltering()
            ]);
            
            addResult('✅ Tutte le Query Completate', 'Controlla i risultati sopra per vedere cosa è stato trovato nel database.');
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
    </script>
