        }
        .container {

        }

            margin: 5px;

            background: #005a9e;
        }

            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin: 10px 0;
        }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;

            }
            
            // Estrai il numero collezionista (pattern: XXX/YYY)
            const collectorPattern = /(\d+)\/(\d+)/;
            const collectorMatch = titleLower.match(collectorPattern);
            if (collectorMatch) {
                info.collectorNumber = collectorMatch[1]; // Prendi solo il primo numero
            }
            
            // Estrai la rarità
            const rarityPatterns = [
                /full art/i,
                /ultra rare/i,
                /secret rare/i,
                /rainbow rare/i,
                /gold rare/i,
                /alternate art/i,
                /alt art/i,
                /special art/i,
                /special illustration/i,
                /illustration rare/i,
                /character rare/i,
                /character super rare/i,
                /super rare/i,
                /rare/i,
                /uncommon/i,
                /common/i
            ];
            
            for (const pattern of rarityPatterns) {
                const match = titleLower.match(pattern);
                if (match) {
                    info.rarity = match[0];
                    break;
                }
            }
            
            return info;
        }

        // Funzione per testare l'estrazione
        function testExtraction() {
            const title = document.getElementById('testTitle').value;
            const result = extractTitleInfo(title);
            
            const resultDiv = document.getElementById('extractionResult');
            resultDiv.innerHTML = `
                <div class="result success">
                    <h4>✅ Informazioni estratte:</h4>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                </div>
            `;
        }

        // Funzione per testare il matching (simulato)
        function testMatching() {
            const title = document.getElementById('testTitle').value;
            const titleInfo = extractTitleInfo(title);
            
            // Simula alcuni risultati dal database
            const mockResults = [
                {
                    name_en: 'Jolteon',
                    expansion_name_en: 'Jungle',
                    collector_number: '4',
                    blueprint_id: '121470',
                    image_url: 'https://example.com/jolteon-jungle.jpg'
                },
                {
                    name_en: 'Jolteon ex',
                    expansion_name_en: 'Terastal Festival ex',
                    collector_number: '209',
                    blueprint_id: '123456',
                    image_url: 'https://example.com/jolteon-ex-terastal.jpg'
                },
                {
                    name_en: 'Jolteon ex',
                    expansion_name_en: 'EX Delta Species',
                    collector_number: '105',
                    blueprint_id: '789012',
                    image_url: 'https://example.com/jolteon-ex-delta.jpg'
                }
            ];
            
            // Simula la logica di matching
            let bestMatch = null;
            let matchReason = '';
            
            // Prima cerca match perfetti con espansione e numero collezionista
            for (const result of mockResults) {
                const name = result.name_en.toLowerCase();
                const expansion = result.expansion_name_en.toLowerCase();
                
                if (title.toLowerCase().includes(name) || name.includes(titleInfo.pokemonName)) {
                    if (titleInfo.expansion && expansion.includes(titleInfo.expansion)) {
                        bestMatch = result;
                        matchReason = 'Match perfetto con espansione';
                        break;
                    }
                    
                    if (titleInfo.collectorNumber && result.collector_number && 
                        result.collector_number.toString().includes(titleInfo.collectorNumber)) {
                        bestMatch = result;
                        matchReason = 'Match perfetto con numero collezionista';
                        break;
                    }
                }
            }
            
            // Se non trova match perfetti, cerca con espansione specifica
            if (!bestMatch) {
                for (const result of mockResults) {
                    const name = result.name_en.toLowerCase();
                    const expansion = result.expansion_name_en.toLowerCase();
                    
                    if ((title.toLowerCase().includes(name) || name.includes(titleInfo.pokemonName)) && 
                        titleInfo.expansion && expansion.includes(titleInfo.expansion)) {
                        bestMatch = result;
                        matchReason = 'Match con espansione specifica';
                        break;
                    }
                }
            }
            
            // Fallback al primo risultato con immagine
            if (!bestMatch) {
                for (const result of mockResults) {
                    if (result.image_url) {
                        bestMatch = result;
                        matchReason = 'Primo risultato con immagine';
                        break;
                    }
                }
            }
            
            const resultDiv = document.getElementById('matchingResult');
            if (bestMatch) {
                resultDiv.innerHTML = `
                    <div class="result success">
                        <h4>✅ Miglior match trovato:</h4>
                        <p><strong>Motivo:</strong> ${matchReason}</p>
                        <pre>${JSON.stringify(bestMatch, null, 2)}</pre>
                        <p><strong>Link generato:</strong> https://www.cardtrader.com/cards/${bestMatch.blueprint_id}</p>
                    </div>
                `;
            } else {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h4>❌ Nessun match trovato</h4>
                    </div>
                `;
            }
        }
    </script>
