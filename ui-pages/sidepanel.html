<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokoin Card Match</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
    <header class="header">
        <div class="brand">
            <img src="../assets/pokoin-512.png" alt="" class="brand-icon">
                <div class="brand-copy">
                    <p class="eyebrow">Pokoin match <span id="extensionVersion" class="extension-version"></span></p>
                    <div class="title-row">
                        <h1 id="cardName">Pokoin match</h1>
                        <p id="listingTotal" class="listing-total" hidden></p>
                    </div>
                </div>
        </div>
        <button id="tabScanBtn" type="button" aria-label="Scan the visible tab for cards" title="Scan visible tab">
            <img id="tabScanPreview" alt="Current tab" hidden>
            <span id="tabScanFallback" class="tab-scan-fallback">Scan tab</span>
        </button>
    </header>

    <main class="panel">
        <section id="status" class="status" hidden></section>

        <section id="emptyActions" class="empty-actions" hidden aria-label="Analyze this tab">
            <button id="loadListingBtn" class="empty-action primary" type="button">Load listing information</button>
            <button id="analyzeScreenshotBtn" class="empty-action" type="button">Analyze Chrome tab screenshot</button>
        </section>

        <section id="candidatesSection" class="candidates" aria-label="Candidate cards" hidden>
            <div id="candidateList"></div>
        </section>

        <section id="frameSection" class="frame-section" hidden>
            <iframe id="pokoinFrame" title="Pokoin card detail" credentialless></iframe>
        </section>

        <section id="powerToolsSection" class="pt-connect" aria-label="Power Tools">
            <div class="pt-copy">
                <p class="eyebrow">Power Tools</p>
                <p id="powerToolsStatus" class="pt-status">Checking…</p>
            </div>
            <button id="powerToolsBtn" type="button" hidden>Connect</button>
        </section>

    </main>

    <script src="../utils/PrintLangs.js"></script>
    <script src="sidepanel.js"></script>
</body>
</html>
