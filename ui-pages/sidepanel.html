<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokoin Card Match</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
    <header class="header">
        <div class="brand">
            <img src="../assets/pokoin-512.png" alt="" class="brand-icon">
            <div>
                <p class="eyebrow">Pokoin match</p>
                <h1 id="cardName">Resolving card...</h1>
            </div>
        </div>
        <button id="refreshBtn" type="button">Refresh</button>
    </header>

    <main class="panel">
        <section id="status" class="status">Reading the active marketplace page.</section>

        <section id="candidatesSection" class="candidates" hidden>
            <h2>Best candidates</h2>
            <div id="candidateList"></div>
        </section>

        <section id="frameSection" class="frame-section" hidden>
            <iframe id="pokoinFrame" title="Pokoin card detail"></iframe>
        </section>

        <section id="debugSection" class="debug">
            <details>
                <summary>Debug details</summary>
                <pre id="debugOutput">Waiting for state...</pre>
            </details>
        </section>
    </main>

    <script src="sidepanel.js"></script>
</body>
</html>
