<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Backend API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .result {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .error {
            background: #ffebee;
            color: #c62828;
        }
        .success {
            background: #e8f5e8;
            color: #2e7d32;
        }
        button {
            background: #2196f3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #1976d2;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .api-url {
            font-family: monospace;
            background: #f0f0f0;
            padding: 5px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>Test Backend API - Supabase Database</h1>
    
    <div>
        <label for="apiUrl">API URL:</label>
        <input type="text" id="apiUrl" value="http://localhost:3000" class="api-url">
        <br>
        <button onclick="testConnection()">Test Connection</button>
        <button onclick="getTables()">Get Tables</button>
        <button onclick="searchPokemon()">Search Pokemon</button>
        <button onclick="searchSpecificPokemon()">Search Specific Pokemon</button>
    </div>
    
    <div>
        <label for="pokemonName">Pokemon Name:</label>
        <input type="text" id="pokemonName" placeholder="e.g., Jolteon, Pikachu" value="Jolteon">
    </div>
    
    <div id="results"></div>

    <script>
        function log(message, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.textContent = message;
            resultsDiv.appendChild(div);
        }
        
        function getApiUrl() {
            return document.getElementById('apiUrl').value;
        }
        
        async function testConnection() {
            try {
                log('🔗 Testing API connection...');
                const response = await fetch(getApiUrl());
                const data = await response.json();
                log('✅ API is running!', 'success');
                log(JSON.stringify(data, null, 2), 'success');
            } catch (error) {
                log(`❌ Connection failed: ${error.message}`, 'error');
                log('💡 Make sure the backend server is running with: node server.js', 'error');
            }
        }
        
        async function getTables() {
            try {
                log('📋 Getting database tables...');
                const response = await fetch(`${getApiUrl()}/api/tables`);
                const data = await response.json();
                
                if (data.tables) {
                    log(`✅ Found ${data.tables.length} tables:`, 'success');
                    data.tables.forEach(table => {
                        log(`  - ${table}`);
                    });
                } else {
                    log('❌ No tables found or error occurred', 'error');
                    log(JSON.stringify(data, null, 2), 'error');
                }
            } catch (error) {
                log(`❌ Error getting tables: ${error.message}`, 'error');
            }
        }
        
        async function searchPokemon() {
            try {
                log('🔍 Searching for Pokemon data...');
                const response = await fetch(`${getApiUrl()}/api/pokemon/jolteon`);
                const data = await response.json();
                
                log(`✅ Search completed for: ${data.pokemon}`, 'success');
                log(`📊 Searched ${data.totalTables} tables`, 'success');
                
                if (data.results && data.results.length > 0) {
                    log(`🎯 Found results in ${data.results.length} tables:`, 'success');
                    data.results.forEach(result => {
                        log(`\n📋 Table: ${result.table} (Column: ${result.column})`);
                        log(`📄 Found ${result.results.length} results:`);
                        result.results.forEach((row, i) => {
                            log(`  ${i + 1}. ${JSON.stringify(row, null, 2)}`);
                        });
                    });
                } else {
                    log('❌ No Pokemon data found', 'error');
                }
            } catch (error) {
                log(`❌ Error searching Pokemon: ${error.message}`, 'error');
            }
        }
        
        async function searchSpecificPokemon() {
            const pokemonName = document.getElementById('pokemonName').value;
            if (!pokemonName) {
                log('❌ Please enter a Pokemon name', 'error');
                return;
            }
            
            try {
                log(`🔍 Searching for: ${pokemonName}...`);
                const response = await fetch(`${getApiUrl()}/api/pokemon/${encodeURIComponent(pokemonName)}`);
                const data = await response.json();
                
                log(`✅ Search completed for: ${data.pokemon}`, 'success');
                log(`📊 Searched ${data.totalTables} tables`, 'success');
                
                if (data.results && data.results.length > 0) {
                    log(`🎯 Found results in ${data.results.length} tables:`, 'success');
                    data.results.forEach(result => {
                        log(`\n📋 Table: ${result.table} (Column: ${result.column})`);
                        log(`📄 Found ${result.results.length} results:`);
                        result.results.forEach((row, i) => {
                            log(`  ${i + 1}. ${JSON.stringify(row, null, 2)}`);
                        });
                    });
                } else {
                    log('❌ No Pokemon data found', 'error');
                }
            } catch (error) {
                log(`❌ Error searching Pokemon: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
