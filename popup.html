<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 350px;
            padding: 15px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .subtitle {
            font-size: 12px;
            opacity: 0.8;
        }
        
        .status-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .status-title {
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            display: inline-block;
        }
        
        .status-connected {
            background: #4CAF50;
            box-shadow: 0 0 8px #4CAF50;
        }
        
        .status-disconnected {
            background: #F44336;
            box-shadow: 0 0 8px #F44336;
        }
        
        .status-loading {
            background: #FF9800;
            box-shadow: 0 0 8px #FF9800;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .stat-item {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 10px;
        }
        
        .stat-number {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 11px;
            opacity: 0.8;
        }
        
        .input-section {
            margin-bottom: 15px;
        }
        
        .input-group {
            margin-bottom: 10px;
        }
        
        label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            opacity: 0.9;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 12px;
            box-sizing: border-box;
        }
        
        .search-button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .search-button:hover {
            background: #45a049;
        }
        
        .search-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .result-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }
        
        .result-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #4CAF50;
        }
        
        .result-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 8px;
            font-size: 12px;
        }
        
        .result-link {
            color: #81C784;
            text-decoration: none;
            font-weight: bold;
        }
        
        .result-link:hover {
            text-decoration: underline;
        }
        
        .footer {
            text-align: center;
            font-size: 10px;
            opacity: 0.7;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .toggle-section {
            margin-bottom: 15px;
        }
        
        .toggle-button {
            width: 100%;
            padding: 8px;
            background: #FF9800;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }
        
        .toggle-button:hover {
            background: #F57C00;
        }
        
        .toggle-button.paused {
            background: #F44336;
        }
        
        .toggle-button.paused:hover {
            background: #D32F2F;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🃏 Pokemon Card Trader</div>
        <div class="subtitle">Linker Extension</div>
    </div>
    
    <div class="status-section">
        <div class="status-title">
            <span class="status-indicator status-loading" id="statusIndicator"></span>
            <span id="statusText">Connessione in corso...</span>
        </div>
    </div>
    
    <div class="stats">
        <div class="stat-item">
            <div class="stat-number" id="cardsProcessed">0</div>
            <div class="stat-label">Carte Processate</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="linksGenerated">0</div>
            <div class="stat-label">Link Generati</div>
        </div>
    </div>
    
    <div class="toggle-section">
        <button class="toggle-button" id="toggleButton">Pausa Estensione</button>
    </div>
    
    <div class="input-section">
        <div class="input-group">
            <label for="titleInput">🔍 Ricerca Manuale (Opzionale):</label>
            <input type="text" id="titleInput" placeholder="Incolla qui il titolo dell'inserzione...">
        </div>
        <button class="search-button" id="searchButton">🔍 Cerca Carta</button>
    </div>
    
    <div class="result-section" id="resultSection">
        <div class="result-title">✅ Risultati Trovati</div>
        <div id="resultContent"></div>
    </div>
    
    <div class="footer">
        Versione 1.4.0 • Connesso a Supabase
    </div>
    
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="popup.js"></script>
</body>
</html>
