<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pokemon Card Trader Linker</title>
    <style>
        body {
            width: 400px;
            margin: 0;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 13px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .logo {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 3px;
        }
        
        .subtitle {
            font-size: 11px;
            opacity: 0.8;
        }
        
        .add-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }
        
        .add-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #4CAF50;
            font-size: 12px;
        }
        
        .add-input {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 8px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
        
        .add-button {
            width: 100%;
            padding: 8px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .add-button:hover {
            background: #45a049;
        }
        
        .notes-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .notes-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #4CAF50;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .clear-button {
            background: #f44336;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 3px 8px;
            font-size: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .clear-button:hover {
            background: #d32f2f;
        }
        
        .note-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 6px;
            font-size: 11px;
            position: relative;
        }
        
        .note-text {
            margin-bottom: 4px;
            word-wrap: break-word;
        }
        
        .note-info {
            font-size: 10px;
            opacity: 0.8;
            margin-bottom: 2px;
            color: #FFD700;
        }
        
        .note-price {
            font-size: 10px;
            color: #4CAF50;
            font-weight: bold;
            margin-bottom: 2px;
        }
        
        .note-date {
            font-size: 9px;
            opacity: 0.7;
            margin-bottom: 4px;
        }
        
        .note-actions {
            display: flex;
            gap: 5px;
        }
        
        .note-link {
            color: #81C784;
            text-decoration: none;
            font-size: 10px;
            font-weight: bold;
        }
        
        .note-link:hover {
            text-decoration: underline;
        }
        
        .delete-button {
            background: #f44336;
            color: white;
            border: none;
            border-radius: 2px;
            padding: 2px 6px;
            font-size: 9px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .delete-button:hover {
            background: #d32f2f;
        }
        
        .empty-notes {
            text-align: center;
            padding: 20px;
            font-style: italic;
            opacity: 0.7;
        }
        
        .auto-add-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 11px;
        }
        
        .auto-add-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: #FF9800;
        }
        
        .auto-add-text {
            opacity: 0.9;
            margin-bottom: 5px;
        }
        
        .auto-add-button {
            background: #FF9800;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 4px 8px;
            font-size: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .auto-add-button:hover {
            background: #F57C00;
        }
        
        .card-details {
            margin-bottom: 10px;
        }
        
        .card-name {
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 4px;
            color: #FFD700;
        }
        
        .card-info {
            font-size: 10px;
            opacity: 0.9;
            margin-bottom: 4px;
        }
        
        .card-price {
            font-size: 10px;
            color: #4CAF50;
            font-weight: bold;
        }
        
        .card-actions {
            display: flex;
            gap: 8px;
        }
        
        .save-button {
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 6px 12px;
            font-size: 10px;
            cursor: pointer;
            transition: background 0.3s;
            flex: 1;
        }
        
        .save-button:hover {
            background: #45a049;
        }
        
        .view-button {
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 6px 12px;
            font-size: 10px;
            cursor: pointer;
            transition: background 0.3s;
            flex: 1;
        }
        
        .view-button:hover {
            background: #1976D2;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">📝 Blocco Note Carte</div>
        <div class="subtitle">Pokemon Card Trader Linker</div>
    </div>
    
    <div class="add-section">
        <div class="add-title">➕ Aggiungi Carta</div>
        <input type="text" id="cardInput" class="add-input" placeholder="Es: Leafeon sv8a, Charizard XY..." />
        <button id="addButton" class="add-button">➕ Aggiungi al Blocco Note</button>
    </div>
    
    <div class="auto-add-section" id="autoAddSection" style="display: none;">
        <div class="auto-add-title">🎯 Carta Corrente</div>
        <div class="card-details" id="cardDetails">
            <div class="card-name" id="cardName"></div>
            <div class="card-info" id="cardInfo"></div>
            <div class="card-price" id="cardPrice"></div>
        </div>
        <div class="card-actions">
            <button id="saveCardButton" class="save-button">💾 Salva Carta</button>
            <button id="viewCardButton" class="view-button">👁️ Visualizza</button>
        </div>
    </div>
    
    <div class="notes-section">
        <div class="notes-title">
            📋 Le Mie Carte
            <button id="clearButton" class="clear-button">🗑️ Svuota</button>
        </div>
        <div id="notesContent">
            <div class="empty-notes">Nessuna carta salvata</div>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
