<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pokemon Card Trader Linker</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 450px;
            min-height: 600px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 13px;
            overflow-x: hidden;
        }
        
        .container {
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }
        
        .logo {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .logo i {
            color: #FFD700;
        }
        
        .subtitle {
            font-size: 11px;
            opacity: 0.8;
            margin-bottom: 10px;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 15px;
            font-size: 11px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-weight: bold;
            color: #FFD700;
            font-size: 14px;
        }
        
        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
            font-weight: 500;
        }
        
        .tab.active {
            background: rgba(255, 255, 255, 0.2);
            color: #FFD700;
        }
        
        .tab:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .add-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
        }
        
        .add-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #4CAF50;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .add-input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            transition: all 0.3s;
        }
        
        .add-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.3);
        }
        
        .add-button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .add-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }
        
        .auto-add-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 152, 0, 0.3);
        }
        
        .auto-add-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #FF9800;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .card-details {
            margin-bottom: 12px;
        }
        
        .card-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
            color: #FFD700;
        }
        
        .card-info {
            font-size: 11px;
            opacity: 0.9;
            margin-bottom: 6px;
        }
        
        .card-price {
            font-size: 11px;
            color: #4CAF50;
            font-weight: bold;
            margin-bottom: 6px;
        }
        
        .card-url {
            font-size: 10px;
            opacity: 0.7;
            margin-bottom: 8px;
            word-break: break-all;
        }
        
        .card-url a {
            color: #81C784;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .card-url a:hover {
            color: #4CAF50;
        }
        
        .card-actions {
            display: flex;
            gap: 8px;
        }
        
        .save-button, .view-button {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-weight: 500;
        }
        
        .save-button {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
        }
        
        .save-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(76, 175, 80, 0.3);
        }
        
        .view-button {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            color: white;
        }
        
        .view-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(33, 150, 243, 0.3);
        }
        
        .notes-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }
        
        .notes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .notes-title {
            font-weight: bold;
            color: #4CAF50;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .notes-actions {
            display: flex;
            gap: 5px;
        }
        
        .action-button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .action-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }
        
        .clear-button {
            background: linear-gradient(45deg, #f44336, #d32f2f);
        }
        
        .clear-button:hover {
            box-shadow: 0 3px 8px rgba(244, 67, 54, 0.3);
        }
        
        .search-box {
            margin-bottom: 12px;
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 8px 12px 8px 35px;
            border: none;
            border-radius: 8px;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
        
        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 12px;
        }
        
        .notes-content {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .notes-content::-webkit-scrollbar {
            width: 6px;
        }
        
        .notes-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        
        .notes-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
        
        .note-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            font-size: 11px;
            position: relative;
            transition: all 0.3s;
            border-left: 3px solid #4CAF50;
        }
        
        .note-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(2px);
        }
        
        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }
        
        .note-text {
            font-weight: bold;
            font-size: 12px;
            word-wrap: break-word;
            flex: 1;
        }
        
        .note-category {
            background: rgba(255, 152, 0, 0.3);
            color: #FF9800;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: bold;
            margin-left: 8px;
        }
        
        .note-info {
            font-size: 10px;
            opacity: 0.9;
            margin-bottom: 4px;
            color: #FFD700;
        }
        
        .note-price {
            font-size: 10px;
            color: #4CAF50;
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .note-url {
            font-size: 10px;
            margin-bottom: 4px;
        }
        
        .note-date {
            font-size: 9px;
            opacity: 0.7;
            margin-bottom: 6px;
        }
        
        .note-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        
        .note-link {
            color: #81C784;
            text-decoration: none;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 8px;
            background: rgba(129, 199, 132, 0.2);
            border-radius: 4px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .note-link:hover {
            background: rgba(129, 199, 132, 0.3);
            transform: translateY(-1px);
        }
        
        .delete-button {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 9px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        
        .delete-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(244, 67, 54, 0.3);
        }
        
        .empty-notes {
            text-align: center;
            padding: 40px 20px;
            font-style: italic;
            opacity: 0.7;
            font-size: 12px;
        }
        
        .empty-notes i {
            font-size: 24px;
            margin-bottom: 10px;
            opacity: 0.5;
        }
        
        .category-filter {
            display: flex;
            gap: 5px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        
        .category-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .category-btn.active {
            background: rgba(76, 175, 80, 0.3);
            color: #4CAF50;
        }
        
        .category-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .settings-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .settings-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #FFD700;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 11px;
        }
        
        .toggle-switch {
            position: relative;
            width: 40px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .toggle-switch.active {
            background: #4CAF50;
        }
        
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.3s;
        }
        
        .toggle-switch.active::after {
            left: 22px;
        }
        
        .export-import {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        
        .export-btn, .import-btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        
        .export-btn {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            color: white;
        }
        
        .import-btn {
            background: linear-gradient(45deg, #FF9800, #F57C00);
            color: white;
        }
        
        .export-btn:hover, .import-btn:hover {
            transform: translateY(-1px);
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            opacity: 0.7;
        }
        
        .loading i {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .success-message {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 10px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .error-message {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 10px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                Blocco Note Carte
            </div>
            <div class="subtitle">Pokemon Card Trader Linker</div>
        </div>
        
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-number" id="totalCards">0</div>
                <div>Totale</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="wishlistCards">0</div>
                <div>Wishlist</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="viewedCards">0</div>
                <div>Viste</div>
            </div>
        </div>
        
        <div class="tabs">
            <div class="tab active" data-tab="add">
                <i class="fas fa-plus"></i> Aggiungi
            </div>
            <div class="tab" data-tab="collection">
                <i class="fas fa-bookmark"></i> Collezione
            </div>
            <div class="tab" data-tab="settings">
                <i class="fas fa-cog"></i> Impostazioni
            </div>
        </div>
        
        <!-- Tab Aggiungi -->
        <div class="tab-content active" id="add-tab">
            <div class="add-section">
                <div class="add-title">
                    <i class="fas fa-plus-circle"></i>
                    Aggiungi Carta
                </div>
                <input type="text" id="cardInput" class="add-input" placeholder="Es: Leafeon sv8a, Charizard XY..." />
                <select id="categorySelect" class="add-input">
                    <option value="wishlist">🎯 Wishlist</option>
                    <option value="viewed">👁️ Viste</option>
                    <option value="favorite">⭐ Preferite</option>
                </select>
                <button id="addButton" class="add-button">
                    <i class="fas fa-plus"></i>
                    Aggiungi al Blocco Note
                </button>
            </div>
            
            <div class="auto-add-section" id="autoAddSection" style="display: none;">
                <div class="auto-add-title">
                    <i class="fas fa-magic"></i>
                    Carta Rilevata
                </div>
                <div class="card-details" id="cardDetails">
                    <div class="card-name" id="cardName"></div>
                    <div class="card-info" id="cardInfo"></div>
                    <div class="card-price" id="cardPrice"></div>
                    <div class="card-url" id="cardUrl"></div>
                </div>
                <div class="card-actions">
                    <button id="saveCardButton" class="save-button">
                        <i class="fas fa-save"></i>
                        Salva Carta
                    </button>
                    <button id="viewCardButton" class="view-button">
                        <i class="fas fa-external-link-alt"></i>
                        Visualizza
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Tab Collezione -->
        <div class="tab-content" id="collection-tab">
            <div class="notes-section">
                <div class="notes-header">
                    <div class="notes-title">
                        <i class="fas fa-bookmark"></i>
                        Le Mie Carte
                    </div>
                    <div class="notes-actions">
                        <button class="action-button" id="exportButton">
                            <i class="fas fa-download"></i>
                            Esporta
                        </button>
                        <button class="action-button clear-button" id="clearButton">
                            <i class="fas fa-trash"></i>
                            Svuota
                        </button>
                    </div>
                </div>
                
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Cerca nelle tue carte..." />
                </div>
                
                <div class="category-filter">
                    <button class="category-btn active" data-category="all">Tutte</button>
                    <button class="category-btn" data-category="wishlist">🎯 Wishlist</button>
                    <button class="category-btn" data-category="viewed">👁️ Viste</button>
                    <button class="category-btn" data-category="favorite">⭐ Preferite</button>
                </div>
                
                <div class="notes-content" id="notesContent">
                    <div class="empty-notes">
                        <i class="fas fa-book-open"></i>
                        <div>Nessuna carta salvata</div>
                        <div style="font-size: 10px; margin-top: 5px;">Inizia aggiungendo la tua prima carta!</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Tab Impostazioni -->
        <div class="tab-content" id="settings-tab">
            <div class="settings-section">
                <div class="settings-title">
                    <i class="fas fa-cog"></i>
                    Impostazioni
                </div>
                
                <div class="setting-item">
                    <span>Rilevamento automatico</span>
                    <div class="toggle-switch" id="autoDetectionToggle"></div>
                </div>
                
                <div class="setting-item">
                    <span>Notifiche prezzo</span>
                    <div class="toggle-switch" id="priceNotificationsToggle"></div>
                </div>
                
                <div class="setting-item">
                    <span>Tema scuro</span>
                    <div class="toggle-switch" id="darkThemeToggle"></div>
                </div>
                
                <div class="export-import">
                    <button class="export-btn" id="exportDataBtn">
                        <i class="fas fa-download"></i>
                        Esporta Dati
                    </button>
                    <button class="import-btn" id="importDataBtn">
                        <i class="fas fa-upload"></i>
                        Importa Dati
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
