<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pokemon Card Trader Linker</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 380px;
            min-height: 480px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 12px;
            overflow-x: hidden;
        }
        
        .container {
            padding: 12px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            text-align: center;
            margin-bottom: 12px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .logo {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .logo i {
            color: #FFD700;
        }
        
        .subtitle {
            font-size: 9px;
            opacity: 0.8;
        }
        
        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        
        .tab {
            flex: 1;
            padding: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 10px;
            font-weight: 500;
        }
        
        .tab.active {
            background: rgba(255, 255, 255, 0.2);
            color: #FFD700;
        }
        
        .tab:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* Sezione Salva URL */
        .save-url-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            border: 2px solid rgba(76, 175, 80, 0.3);
            backdrop-filter: blur(10px);
        }
        
        .save-url-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #4CAF50;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .page-info {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 8px;
        }
        
        .page-title {
            font-weight: bold;
            font-size: 11px;
            margin-bottom: 4px;
            color: #FFD700;
            word-break: break-word;
        }
        
        .page-url {
            font-size: 9px;
            opacity: 0.7;
            word-break: break-all;
            margin-bottom: 4px;
        }
        
        .page-site {
            font-size: 9px;
            color: #81C784;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .save-url-btn {
            width: 100%;
            padding: 8px;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .save-url-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
        }
        
        .save-url-btn.disabled {
            background: #9E9E9E;
            cursor: not-allowed;
        }
        
        /* Sezione Aggiungi Manuale */
        .manual-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            backdrop-filter: blur(10px);
        }
        
        .manual-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #FF9800;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .input-group {
            margin-bottom: 8px;
        }
        
        .input-field {
            width: 100%;
            padding: 6px 8px;
            border: none;
            border-radius: 5px;
            font-size: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
        
        .input-field:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.3);
        }
        
        .manual-add-btn {
            width: 100%;
            padding: 6px;
            background: linear-gradient(45deg, #FF9800, #F57C00);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        
        .manual-add-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(255, 152, 0, 0.3);
        }
        
        /* Sezione Collezione */
        .collection-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            backdrop-filter: blur(10px);
        }
        
        .collection-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .collection-title {
            font-weight: bold;
            color: #E91E63;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .collection-actions {
            display: flex;
            gap: 4px;
        }
        
        .action-btn {
            padding: 4px 6px;
            border: none;
            border-radius: 4px;
            font-size: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        
        .export-btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
        }
        
        .clear-btn {
            background: linear-gradient(45deg, #F44336, #D32F2F);
            color: white;
        }
        
        .search-box {
            position: relative;
            margin-bottom: 8px;
        }
        
        .search-input {
            width: 100%;
            padding: 6px 8px 6px 24px;
            border: none;
            border-radius: 5px;
            font-size: 9px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
        
        .search-icon {
            position: absolute;
            left: 6px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 9px;
        }
        
        .category-filter {
            display: flex;
            gap: 3px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        
        .category-btn {
            padding: 3px 6px;
            border: none;
            border-radius: 3px;
            font-size: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .category-btn.active {
            background: rgba(255, 255, 255, 0.3);
            color: #FFD700;
        }
        
        .cards-list {
            max-height: 180px;
            overflow-y: auto;
        }
        
        .card-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 6px;
            border-left: 3px solid #4CAF50;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .pokemon-sprite {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .pokemon-sprite img {
            width: 24px;
            height: 24px;
            image-rendering: pixelated;
        }
        
        .card-content {
            flex: 1;
            min-width: 0;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 3px;
        }
        
        .card-name {
            font-weight: bold;
            font-size: 10px;
            color: #FFD700;
            flex: 1;
            word-break: break-word;
        }
        
        .card-category {
            font-size: 7px;
            padding: 1px 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            white-space: nowrap;
        }
        
        .card-info {
            font-size: 8px;
            opacity: 0.8;
            margin-bottom: 2px;
            word-break: break-word;
        }
        
        .card-date {
            font-size: 7px;
            opacity: 0.6;
        }
        
        .empty-state {
            text-align: center;
            padding: 20px;
            opacity: 0.7;
        }
        
        .empty-state i {
            font-size: 20px;
            margin-bottom: 6px;
            color: #FFD700;
        }
        
        /* Messaggi */
        .message {
            padding: 6px 10px;
            border-radius: 5px;
            margin-bottom: 8px;
            font-size: 9px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .message.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
        }
        
        .message.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
        }
        
        .message.info {
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid #2196F3;
        }
        
        /* Scrollbar personalizzata */
        .cards-list::-webkit-scrollbar {
            width: 4px;
        }
        
        .cards-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }
        
        .cards-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
        }
        
        .cards-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                Blocco Note Pokemon
            </div>
            <div class="subtitle">Salva e organizza le tue pagine preferite</div>
        </div>
        
        <div class="tabs">
            <div class="tab active" data-tab="save">
                <i class="fas fa-save"></i> Salva
            </div>
            <div class="tab" data-tab="manual">
                <i class="fas fa-plus"></i> Manuale
            </div>
            <div class="tab" data-tab="collection">
                <i class="fas fa-bookmark"></i> Collezione
            </div>
        </div>
        
        <!-- Tab Salva URL -->
        <div class="tab-content active" id="save-tab">
            <div class="save-url-section" id="saveUrlSection">
                <div class="save-url-title">
                    <i class="fas fa-link"></i>
                    Salva Pagina Corrente
                </div>
                <div class="page-info" id="pageInfo">
                    <div class="page-title" id="pageTitle">Caricamento...</div>
                    <div class="page-url" id="pageUrl"></div>
                    <div class="page-site" id="pageSite"></div>
                </div>
                <button id="saveUrlBtn" class="save-url-btn">
                    <i class="fas fa-save"></i>
                    Salva URL
                </button>
            </div>
            
            <div class="manual-section">
                <div class="manual-title">
                    <i class="fas fa-plus-circle"></i>
                    Aggiungi Manualmente
                </div>
                <div class="input-group">
                    <input type="text" id="manualCardInput" class="input-field" placeholder="Es: Charizard, Pikachu..." />
                </div>
                <div class="input-group">
                    <select id="manualCategorySelect" class="input-field">
                        <option value="wishlist">🎯 Wishlist</option>
                        <option value="viewed">👁️ Viste</option>
                        <option value="favorite">⭐ Preferite</option>
                    </select>
                </div>
                <button id="manualAddBtn" class="manual-add-btn">
                    <i class="fas fa-plus"></i>
                    Aggiungi
                </button>
            </div>
        </div>
        
        <!-- Tab Manuale -->
        <div class="tab-content" id="manual-tab">
            <div class="manual-section">
                <div class="manual-title">
                    <i class="fas fa-plus-circle"></i>
                    Aggiungi Carta
                </div>
                <div class="input-group">
                    <input type="text" id="manualCardInput2" class="input-field" placeholder="Es: Charizard, Pikachu..." />
                </div>
                <div class="input-group">
                    <select id="manualCategorySelect2" class="input-field">
                        <option value="wishlist">🎯 Wishlist</option>
                        <option value="viewed">👁️ Viste</option>
                        <option value="favorite">⭐ Preferite</option>
                    </select>
                </div>
                <button id="manualAddBtn2" class="manual-add-btn">
                    <i class="fas fa-plus"></i>
                    Aggiungi
                </button>
            </div>
        </div>
        
        <!-- Tab Collezione -->
        <div class="tab-content" id="collection-tab">
            <div class="collection-section">
                <div class="collection-header">
                    <div class="collection-title">
                        <i class="fas fa-bookmark"></i>
                        Le Mie Pagine
                    </div>
                    <div class="collection-actions">
                        <button class="action-btn export-btn" id="exportBtn">
                            <i class="fas fa-download"></i>
                            Esporta
                        </button>
                        <button class="action-btn clear-btn" id="clearBtn">
                            <i class="fas fa-trash"></i>
                            Svuota
                        </button>
                    </div>
                </div>
                
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Cerca nelle tue pagine..." />
                </div>
                
                <div class="category-filter">
                    <button class="category-btn active" data-category="all">Tutte</button>
                    <button class="category-btn" data-category="wishlist">🎯 Wishlist</button>
                    <button class="category-btn" data-category="viewed">👁️ Viste</button>
                    <button class="category-btn" data-category="favorite">⭐ Preferite</button>
                </div>
                
                <div class="cards-list" id="cardsList">
                    <div class="empty-state">
                        <i class="fas fa-book-open"></i>
                        <div>Nessuna pagina salvata</div>
                        <div style="font-size: 8px; margin-top: 3px;">Inizia salvando la tua prima pagina!</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
