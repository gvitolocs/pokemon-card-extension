<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pokemon Card Trader Linker</title>
    <style>
        body {
            width: 350px;
            margin: 0;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 13px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .logo {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 3px;
        }
        
        .subtitle {
            font-size: 11px;
            opacity: 0.8;
        }
        
        .status-section {
            margin-bottom: 10px;
        }
        
        .status-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .status-connected {
            background: #4CAF50;
            box-shadow: 0 0 6px #4CAF50;
        }
        
        .status-disconnected {
            background: #F44336;
            box-shadow: 0 0 6px #F44336;
        }
        
        .status-loading {
            background: #FF9800;
            box-shadow: 0 0 6px #FF9800;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .result-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            display: none;
        }
        
        .result-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #4CAF50;
            font-size: 12px;
        }
        
        .result-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 6px;
            margin-bottom: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .result-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .result-link {
            color: #81C784;
            text-decoration: none;
            font-weight: bold;
            display: block;
        }
        
        .result-link:hover {
            text-decoration: underline;
        }
        
        .card-info {
            font-size: 10px;
            opacity: 0.8;
            margin-top: 3px;
        }
        
        .score-badge {
            float: right;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: bold;
            color: white;
        }
        
        .score-perfect {
            background: #4CAF50;
        }
        
        .score-good {
            background: #FF9800;
        }
        
        .score-low {
            background: #F44336;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
            opacity: 0.7;
        }
        
        .no-results {
            text-align: center;
            padding: 20px;
            font-style: italic;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🃏 Pokemon Card Trader</div>
        <div class="subtitle">Linker Extension</div>
    </div>
    
    <div class="status-section">
        <div class="status-title">
            <span class="status-indicator status-loading" id="statusIndicator"></span>
            <span id="statusText">Cercando carte...</span>
        </div>
    </div>
    
    <div class="result-section" id="resultSection">
        <div class="result-title">🎯 Top 10 Carte Più Probabili</div>
        <div id="resultContent"></div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html> 
</html>
