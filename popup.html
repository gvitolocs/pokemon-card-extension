<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Card Trader Linker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="pokemon-card-linker-popup">
        <div class="pokemon-card-linker-popup-header">
            <h1 class="pokemon-card-linker-popup-title">🃏 Pokemon Card Trader Linker</h1>
            <p class="pokemon-card-linker-popup-subtitle">Genera link CardTrader dai titoli eBay/Vinted</p>
        </div>
        
        <div class="pokemon-card-linker-popup-content">
            <input type="text" 
                   id="titleInput" 
                   class="pokemon-card-linker-popup-input" 
                   placeholder="Incolla qui il titolo dell'inserzione eBay/Vinted..."
                   autocomplete="off">
            
            <button id="generateButton" class="pokemon-card-linker-popup-button">
                🔗 Genera Link CardTrader
            </button>
            
            <div id="result" class="pokemon-card-linker-popup-result" style="display: none;"></div>
        </div>
        
        <div style="text-align: center; font-size: 12px; color: #666;">
            <p>💡 Suggerimento: Copia il titolo di un'inserzione eBay/Vinted e incollalo qui sopra</p>
        </div>
    </div>
    
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="api-config.js"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-integration.js"></script>
    <script src="popup.js"></script>
</body>
</html>
