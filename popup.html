<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pokemon Card Trader Linker</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 400px;
            min-height: 500px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 13px;
            overflow-x: hidden;
        }
        
        .container {
            padding: 15px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .logo {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .logo i {
            color: #FFD700;
        }
        
        .subtitle {
            font-size: 10px;
            opacity: 0.8;
        }
        
        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        
        .tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 11px;
            font-weight: 500;
        }
        
        .tab.active {
            background: rgba(255, 255, 255, 0.2);
            color: #FFD700;
        }
        
        .tab:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* Sezione Auto-Detection */
        .auto-detection {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid rgba(76, 175, 80, 0.3);
            display: none;
        }
        
        .auto-detection.show {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .auto-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #4CAF50;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .card-details {
            margin-bottom: 10px;
        }
        
        .card-name {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 4px;
            color: #FFD700;
        }
        
        .card-info {
            font-size: 10px;
            opacity: 0.9;
            margin-bottom: 4px;
        }
        
        .card-price {
            font-size: 10px;
            color: #4CAF50;
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .card-url {
            font-size: 9px;
            opacity: 0.7;
            margin-bottom: 8px;
            word-break: break-all;
        }
        
        .card-url a {
            color: #81C784;
            text-decoration: none;
        }
        
        .card-url a:hover {
            color: #4CAF50;
        }
        
        .auto-actions {
            display: flex;
            gap: 6px;
        }
        
        .auto-save-btn, .auto-view-btn {
            flex: 1;
            padding: 6px 10px;
            border: none;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        
        .auto-save-btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
        }
        
        .auto-save-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
        }
        
        .auto-view-btn {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            color: white;
        }
        
        .auto-view-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(33, 150, 243, 0.3);
        }
        
        .auto-save-btn.disabled {
            background: #9E9E9E;
            cursor: not-allowed;
        }
        
        /* Sezione Aggiungi Manuale */
        .manual-add {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
        }
        
        .manual-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #FF9800;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .input-group {
            margin-bottom: 8px;
        }
        
        .input-field {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 5px;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
        
        .input-field:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.3);
        }
        
        .manual-add-btn {
            width: 100%;
            padding: 8px;
            background: linear-gradient(45deg, #FF9800, #F57C00);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .manual-add-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(255, 152, 0, 0.3);
        }
        
        /* Sezione Collezione */
        .collection {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
        }
        
        .collection-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .collection-title {
            font-weight: bold;
            color: #E91E63;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .collection-actions {
            display: flex;
            gap: 4px;
        }
        
        .action-btn {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            font-size: 9px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        
        .export-btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
        }
        
        .clear-btn {
            background: linear-gradient(45deg, #F44336, #D32F2F);
            color: white;
        }
        
        .search-box {
            position: relative;
            margin-bottom: 8px;
        }
        
        .search-input {
            width: 100%;
            padding: 6px 8px 6px 25px;
            border: none;
            border-radius: 5px;
            font-size: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
        
        .search-icon {
            position: absolute;
            left: 6px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 10px;
        }
        
        .category-filter {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        
        .category-btn {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            font-size: 9px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .category-btn.active {
            background: rgba(255, 255, 255, 0.3);
            color: #FFD700;
        }
        
        .cards-list {
            max-height: 200px;
            overflow-y: auto;
        }
        
        .card-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 6px;
            border-left: 3px solid #4CAF50;
        }
        
        .card-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 4px;
        }
        
        .card-item-name {
            font-weight: bold;
            font-size: 11px;
            color: #FFD700;
            flex: 1;
        }
        
        .card-item-category {
            font-size: 8px;
            padding: 2px 4px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
        }
        
        .card-item-info {
            font-size: 9px;
            opacity: 0.8;
            margin-bottom: 3px;
        }
        
        .card-item-date {
            font-size: 8px;
            opacity: 0.6;
        }
        
        .empty-state {
            text-align: center;
            padding: 20px;
            opacity: 0.7;
        }
        
        .empty-state i {
            font-size: 24px;
            margin-bottom: 8px;
            color: #FFD700;
        }
        
        /* Messaggi */
        .message {
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .message.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
        }
        
        .message.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
        }
        
        .message.info {
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid #2196F3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                Blocco Note Carte
            </div>
            <div class="subtitle">Pokemon Card Trader Linker</div>
        </div>
        
        <div class="tabs">
            <div class="tab active" data-tab="auto">
                <i class="fas fa-magic"></i> Auto
            </div>
            <div class="tab" data-tab="manual">
                <i class="fas fa-plus"></i> Manuale
            </div>
            <div class="tab" data-tab="collection">
                <i class="fas fa-bookmark"></i> Collezione
            </div>
        </div>
        
        <!-- Tab Auto-Detection -->
        <div class="tab-content active" id="auto-tab">
            <div class="auto-detection" id="autoDetection">
                <div class="auto-title">
                    <i class="fas fa-magic"></i>
                    Pagina Rilevata
                </div>
                <div class="card-details">
                    <div class="card-name" id="autoCardName"></div>
                    <div class="card-info" id="autoCardInfo"></div>
                    <div class="card-url" id="autoCardUrl"></div>
                </div>
                <div class="auto-actions">
                    <button id="autoSaveBtn" class="auto-save-btn">
                        <i class="fas fa-save"></i>
                        Salva
                    </button>
                    <button id="autoViewBtn" class="auto-view-btn">
                        <i class="fas fa-external-link-alt"></i>
                        Cardmarket
                    </button>
                </div>
            </div>
            
            <div class="manual-add">
                <div class="manual-title">
                    <i class="fas fa-plus-circle"></i>
                    Aggiungi Manualmente
                </div>
                <div class="input-group">
                    <input type="text" id="manualCardInput" class="input-field" placeholder="Es: Leafeon sv8a, Charizard XY..." />
                </div>
                <div class="input-group">
                    <select id="manualCategorySelect" class="input-field">
                        <option value="wishlist">🎯 Wishlist</option>
                        <option value="viewed">👁️ Viste</option>
                        <option value="favorite">⭐ Preferite</option>
                    </select>
                </div>
                <button id="manualAddBtn" class="manual-add-btn">
                    <i class="fas fa-plus"></i>
                    Aggiungi
                </button>
            </div>
        </div>
        
        <!-- Tab Manuale -->
        <div class="tab-content" id="manual-tab">
            <div class="manual-add">
                <div class="manual-title">
                    <i class="fas fa-plus-circle"></i>
                    Aggiungi Carta
                </div>
                <div class="input-group">
                    <input type="text" id="manualCardInput2" class="input-field" placeholder="Es: Leafeon sv8a, Charizard XY..." />
                </div>
                <div class="input-group">
                    <select id="manualCategorySelect2" class="input-field">
                        <option value="wishlist">🎯 Wishlist</option>
                        <option value="viewed">👁️ Viste</option>
                        <option value="favorite">⭐ Preferite</option>
                    </select>
                </div>
                <button id="manualAddBtn2" class="manual-add-btn">
                    <i class="fas fa-plus"></i>
                    Aggiungi
                </button>
            </div>
        </div>
        
        <!-- Tab Collezione -->
        <div class="tab-content" id="collection-tab">
            <div class="collection">
                <div class="collection-header">
                    <div class="collection-title">
                        <i class="fas fa-bookmark"></i>
                        Le Mie Carte
                    </div>
                    <div class="collection-actions">
                        <button class="action-btn export-btn" id="exportBtn">
                            <i class="fas fa-download"></i>
                            Esporta
                        </button>
                        <button class="action-btn clear-btn" id="clearBtn">
                            <i class="fas fa-trash"></i>
                            Svuota
                        </button>
                    </div>
                </div>
                
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Cerca nelle tue carte..." />
                </div>
                
                <div class="category-filter">
                    <button class="category-btn active" data-category="all">Tutte</button>
                    <button class="category-btn" data-category="wishlist">🎯 Wishlist</button>
                    <button class="category-btn" data-category="viewed">👁️ Viste</button>
                    <button class="category-btn" data-category="favorite">⭐ Preferite</button>
                </div>
                
                <div class="cards-list" id="cardsList">
                    <div class="empty-state">
                        <i class="fas fa-book-open"></i>
                        <div>Nessuna carta salvata</div>
                        <div style="font-size: 9px; margin-top: 4px;">Inizia aggiungendo la tua prima carta!</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
